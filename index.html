<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subscribe to Mythology Teller | YouTube</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1f160a 0%, #0b0b0d 75%);
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 400px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 10px;
      color: #f3c65f;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin: 0 0 22px;
    }
    a.btn {
      background: #ff0000;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-block;
      box-shadow: 0 4px 14px rgba(255, 0, 0, 0.35);
    }
    a.btn:active {
      transform: scale(0.98);
    }
  </style>
  <script>
    (function () {
      const webSubUrl = "https://www.youtube.com/@mythology.teller?sub_confirmation=1";
      const ua = navigator.userAgent || "";
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      if (isAndroid) {
        window.location.href =
          "intent://www.youtube.com/@mythology.teller#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=" +
          encodeURIComponent(webSubUrl) +
          ";end";
      } else if (isIOS) {
        window.location.href = "youtube://www.youtube.com/@mythology.teller";
        setTimeout(function () {
          window.location.href = webSubUrl;
        }, 1200);
      } else {
        window.location.href = webSubUrl;
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>Mythology Teller</h1>
    <p>Opening your YouTube app... If it doesn't launch automatically, tap below to subscribe:</p>
    <a class="btn" href="https://www.youtube.com/@mythology.teller?sub_confirmation=1">Open &amp; Subscribe on YouTube</a>
  </div>
</body>
</html>
